  attack-damage-off: "&c攻击伤害显示已关闭！"

admin:
  # {version}
  help:
    - "&b&lAzuraBedWars &8- &7v{version} &8- &b起床战争 - 指令帮助"
    - ""
    - "&7 • &f/bw reload [配置名] &7校验并重新加载配置文件"
    - "&7 • &f/bw config check &7检查所有配置文件的错误"
    - "&7 • &f/bw config schema &7重新生成编辑器补全用的 JSON Schema"
    - "&7 • &f/map &7查看地图相关指令帮助 &3&o[仅EditMode]"
    - "&7 • &f/setup &7查看快速配置相关指令 &3&o[仅EditMode]"
    - "&7 • &f/bw editorMode true/false &7开关编辑模式(重启后生效)"
    - "&7 • &f/bw debugMode true/false &7开关调试日志"
    - "&7 • &f/bw devtools on/off/status/restart/rotate &7开发服的 AI 配置助手(MCP)"
    - "&7 • &f/bw toWorld <worldName> &7前往世界"
    - "&7 • &f/bw loadWorld <worldName> &7加载世界"
    - "&7 • &f/bw start &7立即开始游戏 &3&o[仅非EditMode]"

  # {config} {available}
  unknown-config: "&c没有名为 {config} 的配置，可选: {available}"
  config-clean: "&a配置文件没有发现问题"

  # {count}
  config-problems: "&e配置文件有 {count} 个问题:"

  # {count}
  more-problems: "&7 ……还有 {count} 个，完整列表见控制台"

  # {folder}
  schema-written: "&a已重新生成 {folder}/ 下的 JSON Schema"

  # {config}
  applied: "&f{config} &a已生效"
  applied-next-game: "&f{config} &e已保存，下一局开始时生效"

  # {config} {paths}
  applied-restart: "&f{config} &e已生效，以下项重启后生效: &f{paths}"
  rejected: "&f{config} &c有错误，未应用，仍使用原配置"

  # {world}
  world-not-loaded: "&c世界 {world} 未加载 先用 /bw loadWorld {world}"
  world-missing: "&c服务器目录下没有世界存档 {world}"
  world-load-failed: "&c无法加载世界 {world}"
  world-loaded: "&a世界 {world} 已加载 /bw toWorld {world} 前往"
  devtools-off: "&aMCP 已关闭 端口已释放"
  devtools-off-unsaved: "&eMCP 已关闭 但 devtools.yml 未能保存 重启后会再次开启"
  devtools-not-running: "&eMCP 未开启 /bw devtools on 开启"
  devtools-rotated: "&a令牌已更换 旧令牌立即失效 AI 客户端需要用新命令重新添加"

  # {error}
  devtools-start-failed: "&cMCP 未能启动: {error}"
  devtools-rotate-restart-failed: "&c令牌已更换 但 MCP 未能重新启动: {error}"
  devtools-token-write-failed: "&c无法写入新令牌: {error}"

  # {endpoint} {command}
  devtools-running:
    - "&aMCP 运行中 &f{endpoint}"
    - "&7在 AI 客户端所在的电脑上执行:"
    - "&f{command}"
