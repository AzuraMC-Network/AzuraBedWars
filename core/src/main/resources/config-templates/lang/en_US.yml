death:
  # Added after the message of a final kill
  final-kill: "&b&lFINAL KILL!"

  # {player} {killer} {color} {final}
  quit: "&b&l» {player} {color}disconnected {final}"
  quit-in-combat: "&b&l» {player} {color}disconnected while fleeing {killer} {color}{final}"

  # Deaths without a killer by damage cause, VOID is used for the others
  # {player} {color} {final}
  self:
    VOID:
      - "&b&l» {player} {color}fell into the void {final}"
      - "&b&l» {player} {color}fell out of the world {final}"
    FALL:
      - "&b&l» {player} {color}hit the ground too hard {final}"
      - "&b&l» {player} {color}could not escape gravity {final}"
    FIRE:
      - "&b&l» {player} {color}went up in flames {final}"
      - "&b&l» {player} {color}was burned to a crisp {final}"
    FIRE_TICK:
      - "&b&l» {player} {color}went up in flames {final}"
      - "&b&l» {player} {color}was burned to a crisp {final}"
    LAVA:
      - "&b&l» {player} {color}tried to swim in lava {final}"
    PROJECTILE:
      - "&b&l» {player} {color}was shot {final}"
    ENTITY_EXPLOSION:
      - "&b&l» {player} {color}blew up {final}"
    BLOCK_EXPLOSION:
      - "&b&l» {player} {color}blew up {final}"

  # Deaths with a killer by damage cause, VOID is used for the others
  # {player} {killer} {color} {final}
  kill:
    VOID:
      - "&b&l» {player} {color}was knocked into the void by {killer}{color} {final}"
      - "&b&l» {player} {color}fell into the void while fleeing {killer}{color} {final}"
    ENTITY_ATTACK:
      - "&b&l» {player} {color}was killed by {killer}{color} {final}"
      - "&b&l» {player} {color}could not escape {killer}{color} {final}"
    FALL:
      - "&b&l» {player} {color}hit the ground too hard while fleeing {killer}{color} {final}"
    FIRE:
      - "&b&l» {player} {color}was burned to a crisp while fighting {killer}{color} {final}"
    FIRE_TICK:
      - "&b&l» {player} {color}was burned to a crisp while fighting {killer}{color} {final}"
    LAVA:
      - "&b&l» {player} {color}tried to swim in lava to escape {killer}{color} {final}"
    PROJECTILE:
      - "&b&l» {player} {color}was shot by {killer}{color} {final}"
    ENTITY_EXPLOSION:
      - "&b&l» {player} {color}was blown up by {killer}{color} {final}"
    BLOCK_EXPLOSION:
      - "&b&l» {player} {color}was blown up by {killer}{color} {final}"

