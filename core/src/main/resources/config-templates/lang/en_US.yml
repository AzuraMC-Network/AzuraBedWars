  # {x} {y} {z} {yaw} {pitch}
  aligned: "&aAligned to {x}, {y}, {z} &7Yaw {yaw} Pitch {pitch}"

  # {value} {available}
  invalid-type: "&cInvalid type {value}, available: {available}"
  mysql-unavailable: "&cMYSQL map storage needs database-type MySQL in database.yml"

