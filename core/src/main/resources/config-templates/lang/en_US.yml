# yaml-language-server: $schema=../schema/lang.json
# Text shown to players and admins
# Words in braces such as {player} are filled in by the plugin
config-version: 1

command:
  missing-argument: "&cMissing argument"
  player-offline: "&cThat player is not online"
  no-permission: "&cYou do not have permission"
  players-only: "&cOnly players can use this command!"
  only-in-game: "&cYou can only use this command during a game!"
  shout-usage: "&cUsage: /shout <message>"
  shout-cooldown: "&cYou must wait before shouting again!"
  game-started: "&cThe game has already started or is ending!"

  # {min}
  not-enough-players: "&cNot enough players! At least {min} players in two teams are needed to &nstart the game&c."
  damage-display-usage: "&cUsage: /displaydamage <arrow|attack>"
  damage-display-disabled: "&cThis feature is not enabled!"
  arrow-damage-on: "&aArrow damage display enabled!"
  arrow-damage-off: "&cArrow damage display disabled!"
  attack-damage-on: "&aAttack damage display enabled!"
  attack-damage-off: "&cAttack damage display disabled!"

admin:
  # {version}
  help:
    - "&b&lAzuraBedWars &8- &7v{version} &8- &bBedWars - Commands"
    - ""
    - "&7 • &f/bw reload [config] &7Check and reload config files"
    - "&7 • &f/bw config check &7Check every config file for errors"
    - "&7 • &f/bw config schema &7Write the JSON Schema used by editors"
    - "&7 • &f/map &7Map commands &3&o[editor mode only]"
    - "&7 • &f/setup &7Setup tool commands &3&o[editor mode only]"
    - "&7 • &f/bw editorMode true/false &7Toggle editor mode, applies after a restart"
    - "&7 • &f/bw debugMode true/false &7Toggle debug logging"
    - "&7 • &f/bw devtools on/off/status/restart/rotate &7AI config assistant over MCP for dev servers"
    - "&7 • &f/bw toWorld <worldName> &7Go to a world"
    - "&7 • &f/bw loadWorld <worldName> &7Load a world"
    - "&7 • &f/bw start &7Start the game now &3&o[outside editor mode]"

  # {config} {available}
  unknown-config: "&cNo config named {config}, available: {available}"
  config-clean: "&aNo problems found in the config files"

  # {count}
  config-problems: "&eThe config files have {count} problems:"

  # {count}
  more-problems: "&7 ...and {count} more, see the console for the full list"

  # {folder}
  schema-written: "&aWrote the JSON Schema files in {folder}/"

  # {config}
  applied: "&f{config} &aapplied"
  applied-next-game: "&f{config} &esaved, applies when the next game starts"

  # {config} {paths}
  applied-restart: "&f{config} &eapplied, these apply after a restart: &f{paths}"
  rejected: "&f{config} &chas errors, not applied, the current config stays"

  # {world}
  world-not-loaded: "&cWorld {world} is not loaded, use /bw loadWorld {world} first"
  world-missing: "&cThe server folder has no world save named {world}"
  world-load-failed: "&cCould not load world {world}"
  world-loaded: "&aWorld {world} loaded, /bw toWorld {world} to go there"
  devtools-off: "&aMCP stopped, the port is free"
  devtools-off-unsaved: "&eMCP stopped, but devtools.yml could not be saved, it starts again after a restart"
  devtools-not-running: "&eMCP is off, /bw devtools on to start it"
  devtools-rotated: "&aToken replaced, the old one stops working now, add the server to the AI client again with the new command"

  # {error}
  devtools-start-failed: "&cMCP could not start: {error}"
  devtools-rotate-restart-failed: "&cToken replaced, but MCP could not restart: {error}"
  devtools-token-write-failed: "&cCould not write the new token: {error}"

  # {endpoint} {command}
  devtools-running:
    - "&aMCP running &f{endpoint}"
    - "&7Run this on the computer with the AI client:"
    - "&f{command}"
    - "&7The token is in plugins/AzuraBedWars/devtools/token, the audit log in devtools/audit.log"

map:
  # {version} {range}
  help:
    - "&b&lAzuraBedWars &8- &7v{version} &8- &bBedWars - Map Setup"
    - ""
    - "&7 • &f/map create <map> &7Create a map"
    - "&7 • &f/map setUrl <map> <path> &7Set the world folder of the map"
    - "&7 •  &9&l▸ &fVariables {$serverDir} server folder {$baseDir} plugins {$pluginDir} plugins/AzuraBedWars"
    - "&7 • &f/map setWaiting <map> &7Set the waiting lobby where you stand"
    - "&7 • &f/map setRespawn <map> &7Set the spectator spawn where you stand"
    - "&7 • &f/map setPos1 <map> &7 /map setPos2 <map> &7Set the map border, the higher corner sets the build limit"
    - "&7 • &f/map addBase <map> &7Add a team base where you stand, nearby wool sets its color"
    - "&7 • &f/map addDrop <map> <BASE/DIAMOND/EMERALD> &7Add a generator"
    - "&7 • &f/map addShop <map> <ITEM/UPGRADE> &7Add a shop"
    - "&7 • &f/map remove <map> &7Remove the nearest base, generator or shop within {range} blocks"
    - "&7 • &f/map setAuthor <map> <author> &7Set the author"
    - "&7 • &f/map setTeamPlayers <map> <players> &7Set the players per team"
    - "&7 • &f/map setMinPlayers <map> <players> &7Set the players needed to start"
    - "&7 • &f/map check <map> &7List what the map is missing"
    - "&7 • &f/map info <map> &7Show the map"
    - "&7 • &f/map list [JSON/MYSQL] &7List maps"
    - "&7 • &f/map load <map> &7Read the map from storage again"
    - "&7 • &f/map delete <map> confirm &7Delete the map data, the world files stay"
    - "&7 • &f/map migrate <from> <to> [map] &7Move maps between storages"
    - "&7 • &f/map align &7Snap your position and view to whole numbers"
  invalid-name: "&cMap names may only use letters, digits, underscores and hyphens, up to 30 characters"

  # {map}
  exists: "&cMap {map} already exists"
  save-failed: "&cCould not save the map, see the console"
  created: "&aMap {map} created, next run /map setUrl {map} <world folder>"
  not-found: "&cMap {map} not found"
  not-found-create: "&cMap {map} not found, create it with /map create {map}"
  delete-confirm: "&eThis deletes the config of map {map}, the world folder stays. Run /map delete {map} confirm to go ahead"
  deleted: "&aMap {map} deleted"
  delete-failed: "&cCould not delete the map, see the console"

  # {folder}
  folder-set: "&aWorld folder set to {folder}"

  # {problem}
  folder-problem: " &ebut {problem}"
  waiting-set: "&aWaiting lobby set"
  respawn-set: "&aSpectator spawn set"
  pos1-set: "&aMap border 1 set"
  pos2-set: "&aMap border 2 set"

  # {number} {color}
  base-added: "&aBase #{number} added, nearby wool {color}"

  # {number} {radius}
  base-added-no-wool: "&aBase #{number} added &eno wool within {radius} blocks, a color is assigned when the game starts"

  # {type} {count}
  drop-added: "&a{type} generator added, {count} in total"
  shop-added: "&a{type} shop added, {count} in total"

  # {range}
  nothing-to-remove: "&cNo base, generator or shop within {range} blocks"

  # {what} {location}
  removed: "&aRemoved {what} {location}"

  # {type}
  drop: "{type} generator"
  shop: "{type} shop"
  base: "base"
  author-too-long: "&cAuthor names are up to 24 characters"

  # {author}
  author-set: "&aAuthor set to {author}"
  team-players-range: "&cPlayers per team must be between 1 and 8"

  # {players} {capacity}
  team-players-set: "&aPlayers per team set to {players}, the map holds {capacity}"
  min-players-range: "&cAt least 2 players are needed to start"
  min-players-set: "&aPlayers needed to start set to {players}"

  # {map}
  ready: "&aMap {map} is ready to play"
  not-ready: "&cMap {map} cannot be played yet"

  # {name} {author} {min} {team} {capacity} {height} {pos1} {pos2} {waiting} {respawn} {bases}
  # {base-drops} {diamond-drops} {emerald-drops} {item-shops} {upgrade-shops} {folder}
  info:
    - "&bMap info"
    - ""
    - " &9&l▸ &fName: &b{name}"
    - " &9&l▸ &fAuthor: &b{author}"
    - " &9&l▸ &fPlayers to start: &b{min}"
    - " &9&l▸ &fPlayers per team: &b{team} &7holds {capacity}"
    - " &9&l▸ &fBuild limit: &b{height}"
    - ""
    - " &9&l▸ &fPos1: {pos1}"
    - " &9&l▸ &fPos2: {pos2}"
    - " &9&l▸ &fWaiting lobby: {waiting}"
    - " &9&l▸ &fSpectator spawn: {respawn}"
    - ""
    - " &9&l▸ &fBases:"
    - "{bases}"
    - ""
    - " &9&l▸ &fBase generators: &b{base-drops}"
    - " &9&l▸ &fDiamond generators: &b{diamond-drops}"
    - " &9&l▸ &fEmerald generators: &b{emerald-drops}"
    - " &9&l▸ &fItem shops: &b{item-shops}"
    - " &9&l▸ &fUpgrade shops: &b{upgrade-shops}"
    - ""
    - " &9&l▸ &fWorld folder: &b{folder}"

  # {number} {location}
  base-line: "    &7- Base {number}: {location}"
  none: "&cnone"
  not-set: "&cnot set"
  unknown-world: "unknown world"

  # {storage} {count}
  list-header: "&b{count} maps in storage {storage}"
  list-empty: " &eNo maps found"

  # {map}
  reloaded: "&aRead map {map} from storage again"
  not-in-storage: "&cMap {map} is not in storage"
  same-storage: "&cThe source and target storage must differ"

  # {storage} {map}
  not-in-source: "&cMap {map} is not in {storage}"

