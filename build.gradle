allprojects {
    repositories {
        mavenCentral()
        maven {
            url = "https://repo.codemc.io/repository/nms/"
        }
        maven {
            name = "spigotmc-repo"
            url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
        maven {
            url = "https://jitpack.io"
        }
        maven {
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            url = "https://repo.maven.apache.org/maven2"
        }
        maven {
            url = "https://repo.dmulloy2.net/repository/public/"
        }
        maven {
            url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
        }
        maven {
            url = "https://raw.githubusercontent.com/eurotech/kura_addons/mvn-repo/"
        }
        maven {
            url = "https://repo.codemc.io/repository/maven-releases/"
        }
    }

    group = 'cc.azuramc'
    version = '1.0.0-beta.11'
}

configure(subprojects.findAll { it.path in [':api', ':core'] || it.path.startsWith(':nms:') }) {
    apply plugin: 'java'

    def targetJavaVersion = 21
    def buildJdkVersion = 25
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(buildJdkVersion)
    }
    tasks.withType(JavaCompile).configureEach {
        options.release.set(targetJavaVersion)
        options.fork = true
        options.forkOptions.memoryMaximumSize = '1536m'
    }

    dependencies {
        compileOnly fileTree(dir: 'libs', include: ['*.jar'])
        compileOnly "org.jetbrains:annotations:+"
        compileOnly "org.projectlombok:lombok:1.18.+"
        annotationProcessor "org.projectlombok:lombok:1.18.+"

        if (project.path != ':api') {
            compileOnly project(':api')
        }
    }
}
