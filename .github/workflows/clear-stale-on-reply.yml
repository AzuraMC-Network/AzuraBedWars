name: Clear Stale Labels on Comment

on:
  issue_comment:
    types: [ created ]

permissions:
  issues: write
  contents: read

concurrency:
  group: clear-stale-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    # issue_comment fires for PR comments too; response-time labels only live on issues.
    if: github.event.issue.pull_request == null
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const current = new Set(issue.labels.map(l => l.name));
            const RESPONSE_LABELS = ['⏰ No Response 24h', '⏰ No Response 72h', '⏰ No Response 1w', '⏰ No Response 2w', '⏰ No Response 1m'];
            for (const name of RESPONSE_LABELS) {
              if (current.has(name)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name }).catch(() => {});
                console.log('Removed', name);
              }
            }
