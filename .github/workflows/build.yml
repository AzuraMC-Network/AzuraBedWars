name: Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # release jars take their version from the tag for the bootstrap updater
      - run: ./gradlew build ${TAG:+-Pversion=${TAG#v}}
      - uses: actions/upload-artifact@v4
        with:
          name: AzuraBedWars
          path: plugin/build/libs/AzuraBedWars-*.jar
      - if: github.event_name == 'release'
        run: gh release upload "$TAG" plugin/build/libs/AzuraBedWars-*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
