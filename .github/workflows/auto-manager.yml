name: Auto Label

on:
  issues:
    types: [ opened, labeled, unlabeled, closed, edited ]
  pull_request:
    types: [ opened, labeled, unlabeled, closed, edited ]
  push:
  issue_comment:
    types: [ created ]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Auto Label Issues
        uses: actions/github-script@v7
        if: github.event_name == 'issues'
        with:
          script: |
            const issue = context.payload.issue;
            
            // Skip processing if issue is closed
            if (issue.state === 'closed') {
              console.log(`Issue #${issue.number} is closed, skipping auto-labeling`);
              return;
            }
            
            const labels = issue.labels.map(l => l.name);
            
            // Auto label based on title and body content
            const title = issue.title.toLowerCase();
            const body = issue.body?.toLowerCase() || '';
            
            const newLabels = [];
            
            // Bug detection
            if (title.includes('bug') || title.includes('error') || title.includes('crash') || 
                body.includes('bug') || body.includes('error') || body.includes('crash')) {
              newLabels.push('🐛 Bug');
            }
            
            // Feature request detection
            if (title.includes('feature') || title.includes('enhancement') || title.includes('request') ||
                body.includes('feature') || body.includes('enhancement') || body.includes('request')) {
              newLabels.push('✨ Feature Request');
            }
            
            // Documentation
            if (title.includes('doc') || title.includes('documentation') ||
                body.includes('doc') || body.includes('documentation')) {
              newLabels.push('📚 Documentation');
            }
            
            // High priority
            if (title.includes('urgent') || title.includes('critical') || title.includes('high priority') ||
                body.includes('urgent') || body.includes('critical') || body.includes('high priority')) {
              newLabels.push('🚨 High Priority');
            }
            
            // Add labels if not already present
            if (newLabels.length > 0) {
              const labelsToAdd = newLabels.filter(label => !labels.includes(label));
              if (labelsToAdd.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: labelsToAdd
                  });
                  console.log(`Added labels: ${labelsToAdd.join(', ')}`);
                } catch (error) {
                  console.error('Error adding labels:', error);
                }
              }
            }

      - name: Update PR Labels on Edit
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && github.event.action == 'edited'
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Skip processing if PR is closed
            if (pr.state === 'closed') {
              console.log(`PR #${pr.number} is closed, skipping label update`);
              return;
            }
            
            const labels = pr.labels.map(l => l.name);
            const prBody = pr.body || '';
            
            // Template-based labels to manage
            const templateLabels = [
              '🐛 Bug Fix', '✨ New Feature', '💥 Breaking Change', 
              '♻️ Refactor', '⚡ Performance', '🔧 Chore', 
              '👷 CI', '📚 Documentation', '🧪 Test', '💄 Style',
              '✅ Ready for Review', '🚧 Work in Progress'
            ];
            
            // Remove existing template-based labels
            for (const label of templateLabels) {
              if (labels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: label
                  });
                  console.log(`Removed label: ${label}`);
                } catch (error) {
                  console.error(`Error removing label ${label}:`, error);
                }
              }
            }
            
            const newLabels = [];
            
            // Re-parse PR body for template-based labeling
            const typeRegex = /- \[x\] (bugfix|feature|breaking-change|refactor|performance|chore|ci|docs|test|style)/gi;
            let match;
            while ((match = typeRegex.exec(prBody)) !== null) {
              const changeType = match[1].toLowerCase();
            
              switch (changeType) {
                case 'bugfix':
                  newLabels.push('🐛 Bug Fix');
                  break;
                case 'feature':
                  newLabels.push('✨ New Feature');
                  break;
                case 'breaking-change':
                  newLabels.push('💥 Breaking Change');
                  break;
                case 'refactor':
                  newLabels.push('♻️ Refactor');
                  break;
                case 'performance':
                  newLabels.push('⚡ Performance');
                  break;
                case 'chore':
                  newLabels.push('🔧 Chore');
                  break;
                case 'ci':
                  newLabels.push('👷 CI');
                  break;
                case 'docs':
                  newLabels.push('📚 Documentation');
                  break;
                case 'test':
                  newLabels.push('🧪 Test');
                  break;
                case 'style':
                  newLabels.push('💄 Style');
                  break;
              }
            }
            
            // Check checklist completion status
            const checklistRegex = /- \[x\]/gi;
            const completedChecks = (prBody.match(checklistRegex) || []).length;
            const totalChecks = (prBody.match(/- \[ \]/gi) || []).length + completedChecks;
            
            if (totalChecks > 0) {
              if (completedChecks === totalChecks) {
                newLabels.push('✅ Ready for Review');
              } else {
                newLabels.push('🚧 Work in Progress');
              }
            }
            
            // Add new labels
            if (newLabels.length > 0) {
              const labelsToAdd = newLabels.filter(label => !labels.includes(label));
              if (labelsToAdd.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: labelsToAdd
                  });
                  console.log(`Added labels: ${labelsToAdd.join(', ')}`);
                } catch (error) {
                  console.error('Error adding labels:', error);
                }
              }
            }

      - name: Auto Label PRs
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Skip processing if PR is closed
            if (pr.state === 'closed') {
              console.log(`PR #${pr.number} is closed, skipping auto-labeling`);
              return;
            }
            
            const labels = pr.labels.map(l => l.name);
            
            // Auto label based on branch name and title
            const branch = pr.head.ref.toLowerCase();
            const title = pr.title.toLowerCase();
            
            const newLabels = [];
            
            // Branch-based labeling
            if (branch.includes('fix/') || branch.includes('bugfix/')) {
              newLabels.push('🐛 Bug Fix');
            }
            
            if (branch.includes('feature/') || branch.includes('feat/')) {
              newLabels.push('✨ New Feature');
            }
            
            if (branch.includes('hotfix/')) {
              newLabels.push('🚑 Hot Fix');
            }
            
            if (branch.includes('docs/') || branch.includes('documentation/')) {
              newLabels.push('📚 Documentation');
            }
            
            // Title-based labeling
            if (title.includes('breaking') || title.includes('breaking change')) {
              newLabels.push('💥 Breaking Change');
            }
            
            // Check for release branches
            const baseBranch = pr.base.ref.toLowerCase();
            const headBranch = pr.head.ref.toLowerCase();
            
            // Release branch detection
            if (headBranch.includes('release/')) {
              newLabels.push('🚀 Release');
            }
            
            // Integration branch detection (any branch merging to main branches)
            if (baseBranch === 'main' || baseBranch === 'master' || baseBranch === 'develop') {
              if (headBranch.includes('feature/') || headBranch.includes('feat/')) {
                newLabels.push('✨ Feature Integration');
              } else if (headBranch.includes('fix/') || headBranch.includes('bugfix/')) {
                newLabels.push('🐛 Bug Fix Integration');
              } else if (headBranch.includes('hotfix/')) {
                newLabels.push('🚑 Hotfix Integration');
              } else if (headBranch.includes('docs/') || headBranch.includes('documentation/')) {
                newLabels.push('📚 Documentation Integration');
              }
            }
            
            // General integration (master/main to develop)
            if (baseBranch === 'develop' && (headBranch === 'main' || headBranch === 'master')) {
              newLabels.push('🔄 Integration');
            }
            
            // Parse PR body for template-based labeling
            const prBody = pr.body || '';
            
            // Extract type of change from PR template
            const typeRegex = /- \[x\] (bugfix|feature|breaking-change|refactor|performance|chore|ci|docs|test|style)/gi;
            let match;
            while ((match = typeRegex.exec(prBody)) !== null) {
              const changeType = match[1].toLowerCase();
            
              switch (changeType) {
                case 'bugfix':
                  newLabels.push('🐛 Bug Fix');
                  break;
                case 'feature':
                  newLabels.push('✨ New Feature');
                  break;
                case 'breaking-change':
                  newLabels.push('💥 Breaking Change');
                  break;
                case 'refactor':
                  newLabels.push('♻️ Refactor');
                  break;
                case 'performance':
                  newLabels.push('⚡ Performance');
                  break;
                case 'chore':
                  newLabels.push('🔧 Chore');
                  break;
                case 'ci':
                  newLabels.push('👷 CI');
                  break;
                case 'docs':
                  newLabels.push('📚 Documentation');
                  break;
                case 'test':
                  newLabels.push('🧪 Test');
                  break;
                case 'style':
                  newLabels.push('💄 Style');
                  break;
              }
            }
            
            // Check if all checklist items are completed
            const checklistRegex = /- \[x\]/gi;
            const completedChecks = (prBody.match(checklistRegex) || []).length;
            const totalChecks = (prBody.match(/- \[ \]/gi) || []).length + completedChecks;
            
            if (totalChecks > 0) {
              if (completedChecks === totalChecks) {
                newLabels.push('✅ Ready for Review');
              } else {
                newLabels.push('🚧 Work in Progress');
              }
            }
            
            // Add labels if not already present
            if (newLabels.length > 0) {
              const labelsToAdd = newLabels.filter(label => !labels.includes(label));
              if (labelsToAdd.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: labelsToAdd
                  });
                  console.log(`Added labels: ${labelsToAdd.join(', ')}`);
                } catch (error) {
                  console.error('Error adding labels:', error);
                }
              }
            }

      - name: Check Issue Commit References
        uses: actions/github-script@v7
        if: github.event_name == 'issues' && github.event.action == 'edited'
        with:
          script: |
            const issue = context.payload.issue;
            
            // Skip processing if issue is closed
            if (issue.state === 'closed') {
              console.log(`Issue #${issue.number} is closed, skipping commit reference check`);
              return;
            }
            
            const labels = issue.labels.map(l => l.name);
            
            // Check if issue body contains commit references
            const body = issue.body || '';
            const commitPattern = /\b[a-f0-9]{7,40}\b/gi;
            const commitMatches = body.match(commitPattern);
            
            if (commitMatches && commitMatches.length > 0) {
              // Check if "In Progress" label is not already present
              if (!labels.includes('🔄 In Progress')) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: ['🔄 In Progress']
                  });
                  console.log('Added "In Progress" label');
                } catch (error) {
                  console.error('Error adding In Progress label:', error);
                }
              }
            }

      - name: Check Push for Issue References
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const commits = context.payload.commits || [];
            
            for (const commit of commits) {
              const message = commit.message || '';
              console.log(`Checking commit: ${commit.id} - ${message}`);
            
              // Look for issue references in commit messages (#123, fixes #123, closes #123, etc.)
              const issuePattern = /#(\d+)/g;
              let match;
            
              while ((match = issuePattern.exec(message)) !== null) {
                const issueNumber = parseInt(match[1]);
                console.log(`Found issue reference: #${issueNumber}`);
            
                try {
                  // Get issue details
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber
                  });
            
                  // Skip if issue is closed
                  if (issue.state === 'closed') {
                    console.log(`Issue #${issueNumber} is closed, skipping`);
                    continue;
                  }
            
                  const labels = issue.labels.map(l => l.name);
            
                  // Add "In Progress" label if not already present
                  if (!labels.includes('🔄 In Progress')) {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      labels: ['🔄 In Progress']
                    });
                    console.log(`Added "In Progress" label to issue #${issueNumber}`);
                  }
            
                  // Remove any response time labels since there's activity
                  const responseTimeLabels = [
                    '⏰ No Response 24h',
                    '⏰ No Response 72h', 
                    '⏰ No Response 1w',
                    '⏰ No Response 2w',
                    '⏰ No Response 1m'
                  ];
            
                  for (const label of responseTimeLabels) {
                    if (labels.includes(label)) {
                      try {
                        await github.rest.issues.removeLabel({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issueNumber,
                          name: label
                        });
                        console.log(`Removed response time label ${label} from issue #${issueNumber} due to commit activity`);
                      } catch (error) {
                        console.error(`Error removing label ${label} from issue #${issueNumber}:`, error);
                      }
                    }
                  }
                } catch (error) {
                  console.error(`Error processing issue #${issueNumber}:`, error);
                }
              }
            }

      - name: Check Issue Response Time
        uses: actions/github-script@v7
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            console.log(`Found ${issues.length} open issues`);
            
            for (const issue of issues) {
              // Skip pull requests
              if (issue.pull_request) continue;
            
              const labels = issue.labels.map(l => l.name);
              const issueNumber = issue.number;
            
              // Get comments for this issue
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
            
              // Get commit references to this issue
              const { data: timeline } = await github.rest.issues.listEventsForTimeline({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
            
              // Find the most recent activity (comments, commits, or issue creation)
              let lastActivityTime = new Date(issue.created_at);
            
              // Check comments
              if (comments.length > 0) {
                const lastCommentTime = new Date(comments[comments.length - 1].created_at);
                if (lastCommentTime > lastActivityTime) {
                  lastActivityTime = lastCommentTime;
                }
              }
            
              // Check timeline events for commit references
              const commitEvents = timeline.filter(event => 
                event.event === 'referenced' || 
                event.event === 'committed' ||
                (event.event === 'cross-referenced' && event.source?.type === 'issue')
              );
            
              for (const event of commitEvents) {
                const eventTime = new Date(event.created_at);
                if (eventTime > lastActivityTime) {
                  lastActivityTime = eventTime;
                }
              }
            
              const now = new Date();
              const timeDiff = now - lastActivityTime;
              const hoursDiff = timeDiff / (1000 * 60 * 60);
              const daysDiff = timeDiff / (1000 * 60 * 60 * 24);
            
              console.log(`Issue #${issueNumber}: ${hoursDiff.toFixed(1)} hours since last activity`);
            
              // Define time-based labels to add/remove
              const timeLabels = [
                { label: '⏰ No Response 24h', hours: 24, days: 1 },
                { label: '⏰ No Response 72h', hours: 72, days: 3 },
                { label: '⏰ No Response 1w', hours: 168, days: 7 },
                { label: '⏰ No Response 2w', hours: 336, days: 14 },
                { label: '⏰ No Response 1m', hours: 720, days: 30 }
              ];
            
              let labelsToAdd = [];
              let labelsToRemove = [];
            
              // Determine which labels should be present based on time
              let mostRecentApplicableLabel = null;
            
              // Find the most recent applicable time label
              for (let i = timeLabels.length - 1; i >= 0; i--) {
                const timeLabel = timeLabels[i];
                if (hoursDiff >= timeLabel.hours) {
                  mostRecentApplicableLabel = timeLabel;
                  break;
                }
              }
            
              // Process all labels based on the most recent applicable one
              for (let i = 0; i < timeLabels.length; i++) {
                const timeLabel = timeLabels[i];
                const hasLabel = labels.includes(timeLabel.label);
            
                if (mostRecentApplicableLabel && timeLabel.label === mostRecentApplicableLabel.label) {
                  // Should have this label (the most recent applicable one)
                  if (!hasLabel) {
                    labelsToAdd.push(timeLabel.label);
                  }
                } else {
                  // Should not have this label (either too early or superseded)
                  if (hasLabel) {
                    labelsToRemove.push(timeLabel.label);
                  }
                }
              }
            
              // Add new labels
              if (labelsToAdd.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: labelsToAdd
                  });
                  console.log(`Issue #${issueNumber}: Added labels: ${labelsToAdd.join(', ')}`);
                } catch (error) {
                  console.error(`Error adding labels to issue #${issueNumber}:`, error);
                }
              }
            
              // Remove outdated labels
              for (const labelToRemove of labelsToRemove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: labelToRemove
                  });
                  console.log(`Issue #${issueNumber}: Removed label: ${labelToRemove}`);
                } catch (error) {
                  console.error(`Error removing label ${labelToRemove} from issue #${issueNumber}:`, error);
                }
              }
            }

      - name: Remove Response Time Labels on New Comment
        uses: actions/github-script@v7
        if: github.event_name == 'issue_comment' && github.event.action == 'created'
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            
            // Define all response time labels
            const responseTimeLabels = [
              '⏰ No Response 24h',
              '⏰ No Response 72h', 
              '⏰ No Response 1w',
              '⏰ No Response 2w',
              '⏰ No Response 1m'
            ];
            
            // Remove any response time labels when there's a new comment
            for (const label of responseTimeLabels) {
              if (labels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: label
                  });
                  console.log(`Removed response time label: ${label}`);
                } catch (error) {
                  console.error(`Error removing label ${label}:`, error);
                }
              }
            }

      - name: Handle Closed Issues
        uses: actions/github-script@v7
        if: github.event_name == 'issues' && github.event.action == 'closed'
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            
            try {
              // Remove "In Progress" label if present
              if (labels.includes('🔄 In Progress')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: '🔄 In Progress'
                });
                console.log('Removed "In Progress" label');
              }
            
              // Add "Done" label
              if (!labels.includes('✅ Done')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['✅ Done']
                });
                console.log('Added "Done" label');
              }
            } catch (error) {
              console.error('Error handling closed issue:', error);
            }

      - name: Handle Closed PRs
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            
            try {
              // Check if PR was merged or just closed
              if (pr.merged) {
                // Remove "In Progress" label if present
                if (labels.includes('🔄 In Progress')) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: '🔄 In Progress'
                  });
                  console.log('Removed "In Progress" label from merged PR');
                }
            
                // Remove "Work in Progress" label if present
                if (labels.includes('🚧 Work in Progress')) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: '🚧 Work in Progress'
                  });
                  console.log('Removed "Work in Progress" label from merged PR');
                }
            
                // Add "Merged" label
                if (!labels.includes('✅ Merged')) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['✅ Merged']
                  });
                  console.log('Added "Merged" label');
                }
              } else {
                // PR was closed without merging
                // Remove "In Progress" label if present
                if (labels.includes('🔄 In Progress')) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: '🔄 In Progress'
                  });
                  console.log('Removed "In Progress" label from cancelled PR');
                }
            
                // Remove "Work in Progress" label if present
                if (labels.includes('🚧 Work in Progress')) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: '🚧 Work in Progress'
                  });
                  console.log('Removed "Work in Progress" label from cancelled PR');
                }
            
                // Add "Cancelled" label
                if (!labels.includes('❌ Cancelled')) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['❌ Cancelled']
                  });
                  console.log('Added "Cancelled" label');
                }
              }
            } catch (error) {
              console.error('Error handling closed PR:', error);
            }
