plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.1'
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = "spigotmc-repo"
            url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
        maven {
            url = "https://jitpack.io"
        }
        maven {
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            url = "https://repo.maven.apache.org/maven2"
        }
        maven {
            url = "https://repo.dmulloy2.net/repository/public/"
        }
        maven {
            url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
        }
        maven {
            url = "https://raw.githubusercontent.com/eurotech/kura_addons/mvn-repo/"
        }
        maven {
            url = "https://repo.codemc.io/repository/maven-releases/"
        }
    }

    group = 'cc.azuramc'
    version = '1.0.0-beta.9'
}

subprojects {
    apply plugin: 'java'

    def targetJavaVersion = 17
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    dependencies {
        compileOnly fileTree(dir: 'libs', include: ['*.jar'])
        compileOnly "com.github.retrooper:packetevents-spigot:2.9.3"
        compileOnly "org.projectlombok:lombok:1.18.34"
        annotationProcessor "org.projectlombok:lombok:1.18.34"
    }
}

dependencies {
    implementation project(':azurabedwars-plugin:core')
    implementation project(':azurabedwars-plugin:1_8_R3')
    implementation project(':azurabedwars-plugin:1_9_R1')
    implementation project(':azurabedwars-plugin:1_9_R2')
    implementation project(':azurabedwars-plugin:1_10_R1')
    implementation project(':azurabedwars-plugin:v1_11_R1')
    implementation project(':azurabedwars-plugin:v1_12_R1')
    implementation project(':azurabedwars-plugin:v1_13_R1')
    implementation project(':azurabedwars-plugin:v1_13_R2')
    implementation project(':azurabedwars-plugin:v1_14_R1')
    implementation project(':azurabedwars-plugin:v1_15_R1')
    implementation project(':azurabedwars-plugin:v1_16_R1')
    implementation project(':azurabedwars-plugin:v1_16_R2')
    implementation project(':azurabedwars-plugin:v1_17_R1')
    implementation project(':azurabedwars-plugin:v1_16_R3')
    implementation project(':azurabedwars-plugin:v1_18_R1')
    implementation project(':azurabedwars-plugin:v1_18_R2')
    implementation project(':azurabedwars-plugin:v1_19_R1')
    implementation project(':azurabedwars-plugin:v1_19_R2')
    implementation project(':azurabedwars-plugin:v1_19_R3')
    implementation project(':azurabedwars-plugin:1_20_R1')
    implementation project(':azurabedwars-plugin:1_20_R2')
    implementation project(':azurabedwars-plugin:1_20_R3')
    implementation project(':azurabedwars-plugin:1_20_R4')
    implementation project(':azurabedwars-plugin:1_21_R1')
    implementation project(':azurabedwars-plugin:1_21_R2')
    implementation project(':azurabedwars-plugin:1_21_R3')
